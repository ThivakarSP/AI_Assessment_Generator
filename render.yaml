services:
  - type: web
    name: ai-assessment-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assessment-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

databases:
  - name: ai-assessment-db
    databaseName: ai_assessment
    user: ai_assessment_user
